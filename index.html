<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LeafScan AI — Plant Disease Detector</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0a0f0a;color:#e8f5e9;font-family:'Segoe UI',sans-serif;min-height:100vh;}
  nav{padding:1.2rem 2rem;display:flex;align-items:center;gap:.6rem;border-bottom:1px solid #1b2e1b;}
  nav svg{color:#4caf50;}
  nav span{font-size:1.1rem;font-weight:700;letter-spacing:.5px;}
  .hero{text-align:center;padding:5rem 1rem 3rem;}
  .hero h1{font-size:clamp(2rem,5vw,3.5rem);font-weight:800;line-height:1.1;}
  .hero h1 span{color:#4caf50;}
  .hero p{margin-top:1rem;color:#a5c8a5;font-size:1.1rem;max-width:500px;margin-inline:auto;}
  .upload-area{max-width:560px;margin:2rem auto;border:2px dashed #2e4d2e;border-radius:16px;padding:3rem 2rem;text-align:center;cursor:pointer;transition:border-color .3s,background .3s;}
  .upload-area:hover,.upload-area.drag{border-color:#4caf50;background:#0f1f0f;}
  .upload-area svg{color:#4caf50;margin-bottom:1rem;}
  .upload-area p{color:#a5c8a5;}
  .upload-area small{color:#5a7a5a;font-size:.85rem;}
  #preview{max-width:560px;margin:0 auto 1.5rem;display:none;border-radius:12px;overflow:hidden;}
  #preview img{width:100%;max-height:300px;object-fit:cover;display:block;}
  .btn{display:block;margin:0 auto;padding:.9rem 2.5rem;background:#4caf50;color:#fff;border:none;border-radius:50px;font-size:1rem;font-weight:700;cursor:pointer;transition:background .2s,transform .1s;}
  .btn:hover{background:#43a047;}
  .btn:active{transform:scale(.97);}
  .btn:disabled{background:#2e4d2e;cursor:not-allowed;}
  .status{text-align:center;margin:1rem;font-size:.95rem;min-height:1.4rem;}
  .status.ok{color:#4caf50;}
  .status.err{color:#ef5350;}
  .results{max-width:560px;margin:2rem auto;display:none;}
  .results h2{font-size:1.1rem;color:#a5c8a5;margin-bottom:1rem;}
  .card{background:#0f1f0f;border:1px solid #1b2e1b;border-radius:12px;padding:1.2rem 1.4rem;margin-bottom:1rem;}
  .card.top{border-color:#4caf50;}
  .card-rank{font-size:.8rem;color:#5a7a5a;margin-bottom:.3rem;}
  .card-plant{font-size:1.1rem;font-weight:700;margin-bottom:.2rem;}
  .card-status{font-size:.9rem;color:#a5c8a5;margin-bottom:.6rem;}
  .bar-bg{background:#1b2e1b;border-radius:99px;height:6px;overflow:hidden;}
  .bar-fill{height:6px;background:#4caf50;border-radius:99px;width:0;transition:width .8s ease;}
  .pct{font-size:.85rem;color:#4caf50;text-align:right;margin-top:.3rem;}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;margin-right:.5rem;vertical-align:middle;}
  @keyframes spin{to{transform:rotate(360deg);}}
  footer{text-align:center;padding:3rem 1rem;color:#3a5a3a;font-size:.85rem;}
</style>
</head>
<body>

<nav>
  <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/><path d="M12 6v6l4 2"/></svg>
  <span>🌿 LeafScan</span>
</nav>

<div class="hero">
  <h1>Detect Plant Diseases<br><span>Instantly with AI</span></h1>
  <p>Upload a leaf photo and get an instant diagnosis powered by a model trained on 70,000+ images.</p>
</div>

<div class="upload-area" id="dropZone">
  <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
  <p>Drag & drop a leaf photo here</p>
  <small>or click to browse — JPG, PNG, WEBP</small>
  <input type="file" id="fileInput" accept="image/*" style="display:none"/>
</div>

<div id="preview"><img id="previewImg" src="" alt="preview"/></div>

<button class="btn" id="analyzeBtn" disabled onclick="analyze()">Analyze leaf</button>
<div class="status" id="status"></div>

<div class="results" id="resultsWrap">
  <h2>Top predictions</h2>
  <div id="predList"></div>
</div>

<footer>LeafScan AI &mdash; by Eben Siyabalapitiya</footer>

<script>
const HF_API = 'https://castlers0550-leafscan.hf.space';
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const analyzeBtn = document.getElementById('analyzeBtn');
const statusEl = document.getElementById('status');
const resultsWrap = document.getElementById('resultsWrap');
const predList = document.getElementById('predList');
const preview = document.getElementById('preview');
const previewImg = document.getElementById('previewImg');
let selectedFile = null;

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag'); handleFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', () => handleFile(fileInput.files[0]));

function handleFile(file) {
  if (!file) return;
  selectedFile = file;
  const url = URL.createObjectURL(file);
  previewImg.src = url;
  preview.style.display = 'block';
  analyzeBtn.disabled = false;
  resultsWrap.style.display = 'none';
  statusEl.textContent = '';
  statusEl.className = 'status';
}

function setStatus(msg, type) {
  statusEl.textContent = msg;
  statusEl.className = 'status' + (type ? ' ' + type : '');
}

async function analyze() {
  if (!selectedFile) return;
  analyzeBtn.disabled = true;
  analyzeBtn.innerHTML = '<span class="spinner"></span>Analyzing…';
  setStatus('Sending to AI model…', '');
  resultsWrap.style.display = 'none';

  try {
    const base64 = await new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.readAsDataURL(selectedFile);
    });

    const res = await fetch(`${HF_API}/api/predict`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: base64 })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    renderResults(data.result);
    setStatus('Analysis complete!', 'ok');
  } catch(e) {
    setStatus('Error: ' + e.message, 'err');
  } finally {
    analyzeBtn.disabled = false;
    analyzeBtn.innerHTML = 'Analyze leaf';
  }
}

function renderResults(text) {
  predList.innerHTML = '';
  const blocks = text.trim().split('\n\n').filter(b => b.trim());
  blocks.forEach((block, i) => {
    const lines = block.split('\n');
    const title = lines[0].replace(/#\d+ /, '');
    const status = lines[1] || '';
    const confLine = lines[2] || '';
    const pct = confLine.replace('Confidence: ', '').replace('%', '').trim();
    const healthy = status.toLowerCase().includes('healthy');

    const card = document.createElement('div');
    card.className = 'card' + (i === 0 ? ' top' : '');
    card.innerHTML = `
      <div class="card-rank">Prediction #${i+1}</div>
      <div class="card-plant">${title}</div>
      <div class="card-status">${healthy ? '✅' : '⚠️'} ${status}</div>
      <div class="bar-bg"><div class="bar-fill" id="bar${i}"></div></div>
      <div class="pct">${pct}%</div>`;
    predList.appendChild(card);
    setTimeout(() => {
      const bar = document.getElementById('bar' + i);
      if (bar) bar.style.width = pct + '%';
    }, 100 + i * 100);
  });
  resultsWrap.style.display = 'block';
}
</script>
</body>
</html>
